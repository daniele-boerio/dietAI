# Controlli a ogni push e pull request. Il deploy lo fa Coolify da solo al push su
# main: questa CI non lo ferma, ma dice in pochi minuti se quel push era rotto.
#
# Le migrazioni girano su un Postgres vero, non su SQLite come la suite: è lì che si
# rompono (vincoli, JSONB, nomi delle FK), e una migrazione che fallisce in produzione
# tiene giù il backend. `alembic check` dice se modelli e migrazioni coincidono — un
# modello cambiato senza migrazione passa tutti i test e rompe la produzione.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q

  migrazioni:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dietai
          POSTGRES_PASSWORD: dietai
          POSTGRES_DB: dietai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dietai" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DB_USER: dietai
      DB_PASSWORD: dietai
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: dietai
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt
      - name: Tutte le migrazioni da zero
        run: python -m alembic upgrade head
      - name: Modelli e migrazioni coincidono
        run: python -m alembic check
      - name: L'ultima migrazione torna indietro e riparte
        run: python -m alembic downgrade -1 && python -m alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # `npm ci` come nel Dockerfile: un lockfile scritto su Windows che perde le
      # dipendenze opzionali di Linux si vede qui, non al deploy.
      - run: npm ci
      - run: npm test
      - run: npm run build
