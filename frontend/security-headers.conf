# Gli header di sicurezza, in un file a parte perché nginx non li eredita: una
# `location` che ha un suo `add_header` (gli asset, il service worker) perde tutti
# quelli del livello `server`. Ogni location che ne aggiunge uno include questo file.
#
# La CSP permette solo ciò che l'app usa davvero: script e stili propri, i font di
# Google, immagini anche `blob:`/`data:` (la foto dello scontrino), fetch verso sé
# stessa. Gli stili inline servono a React (`style={{...}}`). Nessuna pagina va
# incorniciata da un'altra: è così che si fa il clickjacking.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
